<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduPlatform · Интеллектуалды білім беру платформасы</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎓 EduPlatform</h1>
  <div id="appView" hidden style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span id="who"></span>
    <button class="alt" id="bell" onclick="App.bell()"></button>
    <button class="alt" onclick="App.logout()">Шығу</button>
  </div>
</header>
<div id="inbox" hidden></div>
<main>
  <section id="loginView" class="card login">
    <h3>Жүйеге кіру</h3>
    <select id="user" style="width:100%"></select>
    <input id="pw" type="password" placeholder="Құпиясөз" style="width:100%" onkeydown="if(event.key==='Enter')App.login()">
    <button onclick="App.login()" style="width:100%;margin-top:8px">Кіру</button>
    <p id="err" class="err"></p>
    <p class="mut">Демо-құпиясөздер: Айжан — s123, Мадина — m123, Серік — t123, Дана (әкімші) — a123, Нұрлан — r123, Қонақ — құпиясөзсіз.</p>
    <p class="mut"><a href="#" onclick="App.reset();return false">Деректерді қалпына келтіру</a> · <a href="uml.png">UML диаграммасы</a></p>
  </section>
  <div id="content"></div>
</main>
<script src="models.js"></script>
<script src="app.js"></script>
</body>
</html>
